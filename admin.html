<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>ZOZ Admin</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Tahoma,sans-serif;
    background:#070b14;
    color:white;
}

.container{
    width:92%;
    max-width:1000px;
    margin:auto;
}

header{
    padding:25px 0;
    border-bottom:1px solid #243149;
}

.logo{
    color:#55e6ff;
    font-size:25px;
    font-weight:bold;
}

main{
    padding:45px 0;
}

h1{
    margin-bottom:10px;
}

.subtitle{
    color:#8997ad;
    margin-bottom:35px;
}

.grid{
    display:grid;
    grid-template-columns:
    repeat(auto-fit,minmax(230px,1fr));
    gap:20px;
}

.card{
    background:#101827;
    border:1px solid #263650;
    border-radius:20px;
    padding:25px;
}

.card h2{
    color:#55e6ff;
    font-size:20px;
    margin-bottom:10px;
}

.card p{
    color:#aebbd0;
    margin-bottom:20px;
}

button{
    width:100%;
    border:0;
    background:#55e6ff;
    color:#061019;
    padding:13px;
    border-radius:12px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    opacity:.85;
}

.logout{
    margin-top:30px;
    background:#202b40;
    color:white;
}
</style>
</head>

<body>

<header>

<div class="container">

<div class="logo">
ZOZ ADMIN ⚙️
</div>

</div>

</header>


<main>

<div class="container">

<h1>
لوحة التحكم
</h1>

<p class="subtitle">
إدارة موقع ZOZ Web Studio
</p>


<div class="grid">


<div class="card">

<h2>💰 الأسعار</h2>

<p>
تعديل أسعار الباقات.
</p>

<button>
إدارة الأسعار
</button>

</div>


<div class="card">

<h2>💼 الخدمات</h2>

<p>
إضافة وتعديل خدمات الموقع.
</p>

<button>
إدارة الخدمات
</button>

</div>


<div class="card">

<h2>🖼️ الأعمال</h2>

<p>
إضافة مشاريع إلى معرض الأعمال.
</p>

<button>
إدارة الأعمال
</button>

</div>


<div class="card">

<h2>📝 المحتوى</h2>

<p>
تعديل النصوص والعناوين.
</p>

<button>
تعديل المحتوى
</button>

</div>


<div class="card">

<h2>📱 التواصل</h2>

<p>
تغيير رقم واتساب وبيانات التواصل.
</p>

<button>
إدارة التواصل
</button>

</div>


<div class="card">

<h2>⚙️ إعدادات الموقع</h2>

<p>
إعدادات عامة للموقع.
</p>

<button>
الإعدادات
</button>

</div>


</div>


<button class="logout">
تسجيل الخروج
</button>

</div>

</main>

</body>
  </html>
